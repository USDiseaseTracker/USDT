name: publish USDT data release

on:
  push:
    branches:
      - main
    paths:
      - 'data/USDT_disease_data.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify CSV exists
        run: |
          test -f data/USDT_disease_data.csv

      - name: Prepare release timestamp
        id: release_metadata
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          echo "release_tag=usdt_data_${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "release_name=USDT data release : ${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_metadata.outputs.release_tag }}
          name: ${{ steps.release_metadata.outputs.release_name }}
          body: |
            Automated release of the latest USDT disease data.
          files: data/USDT_disease_data.csv
          fail_on_unmatched_files: true
      
      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✅ USDT Disease Data Release Complete"
          to: mschnau1@jh.edu
          from: ${{ secrets.GMAIL_ADDRESS }}
          body: |
            USDT Disease Data Release SUCCEEDED.
            
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            
            View run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      
      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ USDT Disease Data Release FAILED"
          to: mschnau1@jh.edu
          from: ${{ secrets.GMAIL_ADDRESS }}
          body: |
            USDT Disease Data Release FAILED!
            
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}
            
            Check the logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
